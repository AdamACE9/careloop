name: Backend checks

# The evaluation harness gates the backend the way tests gate anything else.
# These are the invariants around an autonomous decision to contact someone's
# family, so a regression here is not a style problem.

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'functions/**'
      - 'firestore.rules'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore emulator is a JVM process and firebase-tools refuses
      # Java older than 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        working-directory: functions
        run: npm ci

      - name: Typecheck
        working-directory: functions
        run: npm run typecheck

      - name: Evaluation harness
        working-directory: functions
        run: npm run eval

      - name: Typecheck the rules tests
        working-directory: functions
        run: npm run typecheck:test

      # The security rules are the only thing separating two families' records.
      # These run here rather than locally because the Firestore emulator cannot
      # start on the development machine: its JVM fails to open an AF_UNIX
      # socket pair, the same fault that stops Gradle there.
      # Run from the repo root: firebase.json and firestore.rules both live
      # there, and emulators:exec reads the rules path out of firebase.json.
      - name: Firestore rules tests
        run: >-
          npx --yes firebase-tools@latest emulators:exec
          --only firestore --project careloop-rules-test
          "npm --prefix functions run test:rules"
