# IMPORTANT (see CLAUDE.md §9): on this machine a FORKED Gradle daemon JVM cannot
# establish its internal loopback pipe, so any build that forks a daemon fails with
# "Unable to establish loopback connection".
#
# Gradle forks whenever the daemon's required JVM args differ from the launcher's.
# Keeping these identical to GRADLE_OPTS (see tools/gradle.ps1) lets --no-daemon
# builds run fully in-process, which works.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
