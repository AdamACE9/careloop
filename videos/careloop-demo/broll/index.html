<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>CareLoop b-roll, dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; src: url("assets/fonts/instrument-serif-latin.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #111c3f; }
      body { font-family: "Segoe UI", Inter, sans-serif; color: #fffbf3; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: linear-gradient(135deg, #0f1a3d 0%, #1b2459 48%, #2b1f55 100%); }
      .layer { position: absolute; inset: 0; }
      .blob { position: absolute; border-radius: 50%; will-change: transform; }
      #b1 { width: 1300px; height: 1300px; left: -420px; top: -560px; background: radial-gradient(circle, rgba(236,172,58,0.62) 0%, rgba(236,172,58,0) 62%); }
      #b2 { width: 1300px; height: 1300px; right: -460px; top: -520px; background: radial-gradient(circle, rgba(124,99,255,0.60) 0%, rgba(124,99,255,0) 62%); }
      #b3 { width: 1400px; height: 1400px; left: -520px; bottom: -760px; background: radial-gradient(circle, rgba(32,182,170,0.55) 0%, rgba(32,182,170,0) 62%); }
      #b4 { width: 1300px; height: 1300px; right: -420px; bottom: -720px; background: radial-gradient(circle, rgba(255,120,104,0.50) 0%, rgba(255,120,104,0) 62%); }
      #dots { position: absolute; inset: -40px; background-image: radial-gradient(rgba(255,255,255,0.09) 1.6px, transparent 1.8px); background-size: 30px 30px; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(8,12,32,0) 55%, rgba(8,12,32,0.55) 100%); }

      #caption { position: absolute; left: 0; right: 0; top: 62px; text-align: center; font-family: "Instrument Serif", Georgia, serif;
        font-size: 92px; line-height: 1; letter-spacing: -0.015em; white-space: nowrap; }
      #caption .w { display: inline-block; will-change: transform; opacity: 0; }
      #caption .gold { color: #ffd166; }

      #window { position: absolute; left: 240px; top: 196px; width: 1440px; height: 829px; border-radius: 22px; overflow: hidden;
        background: #fffbf3; box-shadow: 0 70px 140px -40px rgba(3,6,20,0.85), 0 0 0 2px rgba(255,255,255,0.16); will-change: transform; opacity: 0; }
      #chrome { height: 52px; display: flex; align-items: center; padding: 0 22px; background: linear-gradient(#1d2749, #151d3c); position: relative; z-index: 2; }
      .light { width: 14px; height: 14px; border-radius: 50%; margin-right: 9px; }
      #url { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: 720px; height: 32px; border-radius: 10px;
        background: rgba(255,255,255,0.08); color: #d5dcf0; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
      #url svg { width: 14px; height: 14px; }
      #viewport { position: absolute; left: 0; top: 52px; width: 1440px; height: 777px; overflow: hidden; }
      #zoom { position: absolute; left: 0; top: 0; width: 1440px; height: 777px; will-change: transform; }
      #shot { position: absolute; left: 0; top: 0; width: 1440px; height: 777px; display: block; }
      /* Around Cara's message, in screenshot coordinates scaled to 1440 wide. */
      #ring { position: absolute; left: 318px; top: 428px; width: 956px; height: 188px; border-radius: 22px;
        border: 4px solid #e0a93b; box-shadow: 0 0 0 10px rgba(224,169,59,0.18), 0 0 60px rgba(224,169,59,0.45); opacity: 0; will-change: transform; }

      #pill { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; bottom: 58px; display: flex; align-items: center; gap: 14px;
        height: 64px; padding: 0 30px 0 22px; border-radius: 999px; background: rgba(12,18,44,0.88); border: 2px solid rgba(255,209,102,0.45);
        font-size: 27px; font-weight: 600; color: #fffbf3; white-space: nowrap; opacity: 0; will-change: transform; }
      #pill svg { width: 28px; height: 28px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1920" data-height="1080">
      <div id="bg" class="layer clip" data-start="0" data-duration="9" data-track-index="0">
        <div class="blob" id="b1"></div>
        <div class="blob" id="b2"></div>
        <div class="blob" id="b3"></div>
        <div class="blob" id="b4"></div>
        <div id="dots"></div>
        <div id="vignette"></div>
      </div>

      <div id="scene" class="layer clip" data-start="0" data-duration="9" data-track-index="1">
        <div id="caption">
          <span class="w">Look,</span> <span class="w">it</span> <span class="w gold">just</span> <span class="w gold">added</span> <span class="w gold">this</span>
          <span class="w">to</span> <span class="w">the</span> <span class="w">dashboard!</span>
        </div>

        <div id="window">
          <div id="chrome">
            <div class="light" style="background:#ff5f57"></div>
            <div class="light" style="background:#febc2e"></div>
            <div class="light" style="background:#28c840"></div>
            <div id="url">
              <svg viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="#9fb0d6" /><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="#9fb0d6" stroke-width="1.6" /></svg>
              careloop--careloop-adam.europe-west4.hosted.app/dashboard/calls
            </div>
          </div>
          <div id="viewport">
            <div id="zoom">
              <img id="shot" src="assets/dashboard.png" alt="" />
              <div id="ring"></div>
            </div>
          </div>
        </div>

        <div id="pill">
          <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="13" fill="none" stroke="#ffd166" stroke-width="5" /></svg>
          Written by Cara, seconds after the call
        </div>
      </div>

      <audio id="sfx-whoosh" src="assets/sfx/whoosh-short.mp3" data-start="0.25" data-duration="0.8" data-track-index="20" data-volume="0.35"></audio>
      <audio id="sfx-pop" src="assets/sfx/pop.mp3" data-start="1.55" data-duration="0.7" data-track-index="21" data-volume="0.4"></audio>
      <audio id="sfx-chime" src="assets/sfx/chime.mp3" data-start="1.7" data-duration="2.5" data-track-index="22" data-volume="0.28"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#b1", { x: 0, y: 0, scale: 1 }, { x: 180, y: 120, scale: 1.12, duration: 9, ease: "sine.inOut" }, 0);
      tl.fromTo("#b2", { x: 0, y: 0, scale: 1 }, { x: -200, y: 160, scale: 0.92, duration: 9, ease: "sine.inOut" }, 0);
      tl.fromTo("#b3", { x: 0, y: 0, scale: 1 }, { x: 220, y: -140, scale: 1.08, duration: 9, ease: "sine.inOut" }, 0);
      tl.fromTo("#b4", { x: 0, y: 0, scale: 1 }, { x: -180, y: -120, scale: 1.1, duration: 9, ease: "sine.inOut" }, 0);

      // Caption, word by word.
      tl.fromTo("#caption .w", { opacity: 0, y: 40, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out", stagger: 0.07 }, 0.1);

      // Window rises in.
      tl.fromTo("#window", { opacity: 0, y: 70, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "expo.out" }, 0.3);

      // Highlight Cara's message.
      tl.fromTo("#ring", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 1.55);
      tl.fromTo("#ring", { boxShadow: "0 0 0 10px rgba(224,169,59,0.18), 0 0 60px rgba(224,169,59,0.45)" },
        { boxShadow: "0 0 0 18px rgba(224,169,59,0.08), 0 0 90px rgba(224,169,59,0.6)", duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 2.05);

      // Camera pushes in until her explanation is readable, box centred in the window.
      tl.fromTo("#zoom", { x: 0, y: 0, scale: 1 },
        { x: -76, y: -134, scale: 1.42, transformOrigin: "796px 522px", duration: 2.6, ease: "power2.inOut" }, 2.3);
      tl.fromTo("#zoom", { scale: 1.42 }, { scale: 1.46, duration: 3.6, ease: "sine.out", immediateRender: false }, 4.9);

      tl.fromTo("#pill", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "expo.out" }, 3.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
