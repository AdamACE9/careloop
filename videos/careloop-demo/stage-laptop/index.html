<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>CareLoop demo stage, laptop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; src: url("assets/fonts/instrument-serif-latin.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #111c3f; }
      body { font-family: "Segoe UI", Inter, sans-serif; color: #fffbf3; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: linear-gradient(135deg, #0f1a3d 0%, #1b2459 48%, #2b1f55 100%); }
      .layer { position: absolute; inset: 0; }

      /* Aurora: four brand-adjacent lights drifting on a seamless 12 s loop. */
      .blob { position: absolute; border-radius: 50%; will-change: transform; }
      #b1 { width: 1300px; height: 1300px; left: -420px; top: -560px; background: radial-gradient(circle, rgba(236,172,58,0.62) 0%, rgba(236,172,58,0) 62%); }
      #b2 { width: 1300px; height: 1300px; right: -460px; top: -520px; background: radial-gradient(circle, rgba(124,99,255,0.60) 0%, rgba(124,99,255,0) 62%); }
      #b3 { width: 1400px; height: 1400px; left: -520px; bottom: -760px; background: radial-gradient(circle, rgba(32,182,170,0.55) 0%, rgba(32,182,170,0) 62%); }
      #b4 { width: 1300px; height: 1300px; right: -420px; bottom: -720px; background: radial-gradient(circle, rgba(255,120,104,0.50) 0%, rgba(255,120,104,0) 62%); }
      #dots { position: absolute; inset: -40px; background-image: radial-gradient(rgba(255,255,255,0.09) 1.6px, transparent 1.8px); background-size: 30px 30px; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(8,12,32,0) 55%, rgba(8,12,32,0.55) 100%); }

      /* Label */
      #label { position: absolute; left: 50%; top: 34px; height: 48px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 12px; padding: 0 22px 0 16px; border-radius: 999px;
        background: rgba(12,18,44,0.55); border: 2px solid rgba(255,255,255,0.16); font-size: 21px; font-weight: 600; letter-spacing: 0.01em; color: #fffbf3; }
      #label svg { width: 24px; height: 24px; display: block; }

      /* Browser window. The recording is composited into #screen at
         left 160, top 162, 1600 x 858, so these numbers must not move. */
      #window { position: absolute; left: 160px; top: 110px; width: 1600px; height: 910px; border-radius: 22px; overflow: hidden;
        background: #0b1226; box-shadow: 0 70px 140px -40px rgba(3,6,20,0.85), 0 0 0 2px rgba(255,255,255,0.14); }
      #chrome { height: 52px; display: flex; align-items: center; padding: 0 22px; background: linear-gradient(#1d2749, #151d3c); border-bottom: 1px solid rgba(255,255,255,0.08); position: relative; }
      .light { width: 14px; height: 14px; border-radius: 50%; margin-right: 9px; }
      #url { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: 720px; height: 32px; border-radius: 10px;
        background: rgba(255,255,255,0.08); color: #d5dcf0; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
      #url svg { width: 14px; height: 14px; }
      #screen { position: absolute; left: 0; top: 52px; width: 1600px; height: 858px; background: #0b1226; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="bg" class="layer clip" data-start="0" data-duration="12" data-track-index="0">
        <div class="blob" id="b1"></div>
        <div class="blob" id="b2"></div>
        <div class="blob" id="b3"></div>
        <div class="blob" id="b4"></div>
        <div id="dots"></div>
        <div id="vignette"></div>
      </div>

      <div id="stage" class="layer clip" data-start="0" data-duration="12" data-track-index="1">
        <div id="label">
          <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="13" fill="none" stroke="#ffd166" stroke-width="5" /></svg>
          The family dashboard
        </div>
        <div id="window">
          <div id="chrome">
            <div class="light" style="background:#ff5f57"></div>
            <div class="light" style="background:#febc2e"></div>
            <div class="light" style="background:#28c840"></div>
            <div id="url">
              <svg viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="#9fb0d6" /><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="#9fb0d6" stroke-width="1.6" /></svg>
              careloop--careloop-adam.europe-west4.hosted.app
            </div>
          </div>
          <div id="screen"></div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Every tween yoyos back to its start by 12 s, so the render loops seamlessly.
      tl.fromTo("#b1", { x: 0, y: 0, scale: 1 }, { x: 180, y: 120, scale: 1.12, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#b2", { x: 0, y: 0, scale: 1 }, { x: -200, y: 160, scale: 0.92, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#b3", { x: 0, y: 0, scale: 1 }, { x: 220, y: -140, scale: 1.08, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#b4", { x: 0, y: 0, scale: 1 }, { x: -180, y: -120, scale: 1.1, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#dots", { x: 0, y: 0 }, { x: 30, y: 30, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
